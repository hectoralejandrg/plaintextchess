[package]
name = "chess-server"
version = "0.1.0"
edition = "2021"

[dependencies]
chess-core = { path = "../core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
# player-auth: argon2id password hashing (design D5) and SHA-256 for the
# session-token hash (design D6 — the token has full entropy, so a fast
# hash is the right choice there and no second KDF is needed).
argon2 = "0.5"
sha2 = "0.10"

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["connect"] }
