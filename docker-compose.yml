# Local multi-node setup for the split realtime architecture (Phase 2+).
#
# Services:
#   redis       - Redis 7 (event fabric)
#   logic       - Authoritative logic tier (TIER=logic)
#   transport-1 - First transport node (TIER=transport)
#   transport-2 - Second transport node (TIER=transport)
#   proxy       - NGINX reverse proxy (round-robin, no sticky sessions)
#
# Start: docker compose up -d --build
# Stop:  docker compose down -v
# Logs:  docker compose logs -f

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  logic:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TIER: logic
      REDIS_URL: redis://redis:6379
      DATABASE_URL: sqlite:/data/app.db
      BIND: 0.0.0.0
      PORT: "3000"
      RECONNECT_GRACE_SECS: "60"
      RUST_LOG: info
    volumes:
      - logic-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  transport-1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TIER: transport
      REDIS_URL: redis://redis:6379
      BIND: 0.0.0.0
      PORT: "3001"
      RECONNECT_GRACE_SECS: "60"
      RUST_LOG: info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  transport-2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TIER: transport
      REDIS_URL: redis://redis:6379
      BIND: 0.0.0.0
      PORT: "3002"
      RECONNECT_GRACE_SECS: "60"
      RUST_LOG: info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - transport-1
      - transport-2
    restart: unless-stopped

volumes:
  logic-data: