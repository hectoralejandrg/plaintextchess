# NGINX configuration for split realtime architecture (Phase 2 multi-node)
# Load balancer for WebSocket transport nodes — NO STICKY SESSIONS REQUIRED.
#
# The authoritative logic tier routes messages to the transport node that holds
# each connection (via Redis registry). The load balancer can distribute
# incoming connections round-robin without affinity because:
# 1. Transport nodes are stateless (no game state)
# 2. Outbound routing targets the connection's owning node via Redis registry
# 3. Reconnects to any node work via Redis-backed session/room state

# Upstream transport nodes (round-robin, no sticky sessions)
upstream transport_nodes {
    server transport-1:3001;
    server transport-2:3002;
    # Add more nodes here as needed; no ip_hash or sticky sessions
}

# Map for WebSocket upgrade headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Health check endpoint (proxied to transport nodes)
    location /healthz {
        proxy_pass http://transport_nodes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint
    location /ws {
        proxy_pass http://transport_nodes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connections alive for WebSocket ping/pong (20s interval)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Buffer settings for WebSocket
        proxy_buffering off;
    }

    # Optional: forward all other traffic (e.g., future REST endpoints)
    location / {
        proxy_pass http://transport_nodes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}